<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e0533a">
  <title>{{ APP_NAME }} · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=Inter:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <div class="blob b3" aria-hidden="true"></div>
  <main class="login-wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" class="login-card reveal" style="--i: 0">
      <div class="login-mark"><svg class="vault-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="22.5" fill="#1f2a36" stroke="#c9a461" stroke-width="2"/>
          <circle cx="24" cy="24" r="15" fill="none" stroke="#c9a461" stroke-width="2.2"/>
          <path d="M24 3.5v5M24 39.5v5M3.5 24h5M39.5 24h5M9.7 9.7l3.6 3.6M34.7 34.7l3.6 3.6M9.7 38.3l3.6-3.6M34.7 13.3l3.6-3.6" stroke="#c9a461" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="24" cy="24" r="4.5" fill="#e6c884"/>
          <path d="M24 17.5l2.2 6.5L24 26l-2.2-2L24 17.5z" fill="#e6c884"/>
        </svg></div>
      <h1 class="display">{{ APP_NAME }}</h1>
      <p class="muted">Our family's recipes, kept safe</p>
      <label>Family password
        <input type="password" name="password" autofocus required>
      </label>
      <label class="keep">
        <input type="checkbox" name="remember" value="1" checked>
        Keep this device signed in for a year
      </label>
      <button class="btn big wide">Come in</button>
    </form>
  </main>
</body>
</html>
